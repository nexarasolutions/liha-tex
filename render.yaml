# Render blueprint — deploys the Liha Tex API and a free Postgres instance.
# Prefer Neon? Delete the `databases` block and paste a Neon DATABASE_URL instead.
services:
  - type: web
    name: liha-tex-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: liha-tex-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://liha-tex.vercel.app

databases:
  - name: liha-tex-db
    plan: free
    databaseName: liha_tex
    user: liha
